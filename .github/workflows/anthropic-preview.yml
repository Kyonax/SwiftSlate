name: Anthropic Preview APK

# Personal build of the Anthropic-header patch. Builds the side-by-side `preview`
# variant (com.musheer360.swiftslate.preview, signed with the committed debug key so
# every build upgrades the previous one in place) and attaches the APK to a GitHub
# release, so it can be downloaded straight from a phone.

on:
  workflow_dispatch:
  push:
    branches: [anthropic]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC"

jobs:
  build:
    name: Build & publish preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Use the stable debug key
        shell: bash
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore

      - name: Build preview APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assemblePreview --no-daemon --configuration-cache-problems=warn \
            -PversionCode="$VERSION_CODE" \
            -PversionName="anthropic-${GITHUB_SHA:0:7}"
          mv app/build/outputs/apk/preview/app-preview.apk \
             "app/build/outputs/apk/preview/SwiftSlate-anthropic-${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: anthropic-${{ github.run_number }}
          name: SwiftSlate Anthropic build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Preview build with Anthropic API support (x-api-key + anthropic-version on
            model-list requests; temperature omitted for api.anthropic.com).
            Installs next to the F-Droid version as "SwiftSlate Preview".
          files: app/build/outputs/apk/preview/SwiftSlate-anthropic-*.apk
